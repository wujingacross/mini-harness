<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>deepseek HARNESS</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="/styles/main.css">
</head>
<body class="flex h-screen w-screen overflow-hidden select-none bg-white text-slate-900">

  <!-- Left Full-Height Sidebar Mount (Spans full height from top to bottom) -->
  <aside id="sidebarMount" class="h-full border-r border-slate-200 bg-[#f8f9fa] flex flex-col shrink-0 select-none transition-all duration-200"></aside>

  <!-- Right Main Area (Header + Trajectory Stream + Input) -->
  <div class="flex-1 flex flex-col h-full overflow-hidden bg-white">
    <!-- Main Top Navigation Header -->
    <header class="h-12 border-b border-slate-200 bg-white px-5 flex items-center justify-between shrink-0 z-20">
      <!-- Left: Session Title, Model Badge, Tabs -->
      <div class="flex items-center space-x-3">
        <span id="headerSessionTitle" class="text-xs font-semibold text-slate-800 truncate max-w-sm">New Session</span>
        <span class="px-2 py-0.5 text-[10px] font-medium text-slate-500 bg-slate-100 rounded-full border border-slate-200 flex items-center gap-1">
          <i class="fa-solid fa-cube text-[9px] text-slate-400"></i>
          <span id="headerModelBadge">standard</span>
        </span>

        <!-- Tab Switcher (对话 | 轨迹) -->
        <div class="flex items-center space-x-1 text-xs ml-3">
          <button id="tabChatBtn" class="px-2.5 py-1 text-xs font-medium text-blue-600 border-b-2 border-blue-600 transition cursor-pointer">对话</button>
          <button id="tabTrajectoryBtn" class="px-2.5 py-1 text-xs font-medium text-slate-500 hover:text-slate-800 transition cursor-pointer">轨迹</button>
        </div>
      </div>

      <!-- Right: Action Buttons -->
      <div class="flex items-center space-x-2">
        <button id="exportSessionBtn" class="px-2.5 py-1 text-xs font-medium text-slate-600 bg-slate-50 hover:bg-slate-100 border border-slate-200 rounded-lg transition flex items-center gap-1.5 cursor-pointer">
          <span>Session log</span>
          <i class="fa-solid fa-download text-[10px] text-slate-400"></i>
        </button>
      </div>
    </header>

    <!-- Main Content Workspace (Stream & Input Area) -->
    <main class="flex-1 flex flex-col overflow-hidden relative">
      <!-- Conversation & Trajectory Stream Mount -->
      <div id="chatStreamMount" class="flex-1 overflow-y-auto px-16 py-6 space-y-3 select-text max-w-4xl w-full mx-auto"></div>

      <!-- Floating Bottom Input Area Mount -->
      <div id="inputAreaMount" class="shrink-0 p-4 max-w-3xl w-full mx-auto"></div>
    </main>
  </div>

  <!-- Entry Script Module -->
  <script type="module" src="/src/main.js"></script>
</body>
</html>
